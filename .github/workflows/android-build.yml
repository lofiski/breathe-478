name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The Gradle wrapper (incl. the binary gradle-wrapper.jar) is generated
      # here instead of being committed to the repo.
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.10

      # A single "universal" release APK bundles native libs for every CPU
      # architecture (~47MB for this app). Splitting per ABI means the file
      # a real phone downloads only contains the code it can actually run.
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      # Actions "artifacts" always come back as a zip, need a signed-in
      # session, and get buried inside a specific run. A GitHub Release asset
      # is a direct, un-zipped file download and shows up on the repo's
      # Releases list. We overwrite one rolling "latest" release every build
      # instead of piling up a release per commit.
      - name: Publish latest release with the raw APKs
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk breathe478-arm64.apk       # nearly all phones since ~2019
          cp app-armeabi-v7a-release.apk breathe478-arm32.apk     # older/budget devices
          cp app-x86_64-release.apk breathe478-x86_64.apk         # emulators, rare x86 devices
          cd -
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            build/app/outputs/flutter-apk/breathe478-arm64.apk \
            build/app/outputs/flutter-apk/breathe478-arm32.apk \
            build/app/outputs/flutter-apk/breathe478-x86_64.apk \
            --repo "${{ github.repository }}" \
            --title "478 呼吸 · 最新构建" \
            --notes "自动构建自 commit ${{ github.sha }}。大多数手机（2019 年后）下载 **breathe478-arm64.apk** 即可；老设备用 breathe478-arm32.apk。未签名/debug 签名，仅供自测。" \
            --latest
