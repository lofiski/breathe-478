name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The Gradle wrapper (incl. the binary gradle-wrapper.jar) is generated
      # here instead of being committed to the repo.
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.10

      - name: Build release APK
        run: flutter build apk --release

      # Actions "artifacts" always come back as a zip, need a signed-in
      # session, and get buried inside a specific run. A GitHub Release asset
      # is a direct, un-zipped file download and shows up on the repo's
      # Releases list. We overwrite one rolling "latest" release every build
      # instead of piling up a release per commit.
      - name: Publish latest release with the raw APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk breathe478.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest breathe478.apk \
            --repo "${{ github.repository }}" \
            --title "478 呼吸 · 最新构建" \
            --notes "自动构建自 commit ${{ github.sha }}，可直接下载安装（未签名/debug 签名，仅供自测）。" \
            --latest
